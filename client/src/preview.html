<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Превью авторизации</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: #f3f4f6;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    gap: 24px;
    flex-wrap: wrap;
    padding: 24px;
  }

  .auth-card {
    background: #fff;
    padding: 32px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    width: 360px;
  }
  .auth-card h2 { margin: 0 0 20px; text-align: center; font-size: 22px; }
  .auth-card form { display: flex; flex-direction: column; gap: 12px; }
  .auth-card input {
    padding: 10px 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    transition: border-color .15s;
  }
  .auth-card input:focus { border-color: #2563eb; }
  .auth-card button {
    padding: 10px;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    transition: background .15s;
  }
  .auth-card button:hover { background: #1d4ed8; }
  .auth-card button:disabled { opacity: .6; cursor: not-allowed; }
  .error { color: #dc2626; font-size: 14px; margin: 0; }
  .auth-card p { text-align: center; font-size: 14px; margin: 16px 0 0; color: #4b5563; }
  .auth-card a { color: #2563eb; text-decoration: none; font-weight: 500; }
  .auth-card a:hover { text-decoration: underline; }
  .profile p { margin: 8px 0; font-size: 15px; color: #374151; }
  .profile strong { color: #111827; }
</style>
</head>
<body>

  <!-- РЕГИСТРАЦИЯ -->
  <div class="auth-card">
    <h2>Регистрация</h2>
    <form onsubmit="event.preventDefault()">
      <input placeholder="Имя" required>
      <input placeholder="Фамилия" required>
      <input placeholder="Телефон" required>
      <input type="email" placeholder="Email" required>
      <input type="password" placeholder="Пароль" required>
      <input type="password" placeholder="Повторите пароль" required>
      <button type="submit">Зарегистрироваться</button>
    </form>
    <p>Уже есть аккаунт? <a href="#">Войти</a></p>
  </div>

  <!-- ВХОД -->
  <div class="auth-card">
    <h2>Вход</h2>
    <form onsubmit="event.preventDefault()">
      <input type="email" placeholder="Email" value="test@mail.com" required>
      <input type="password" placeholder="Пароль" value="123456" required>
      <p class="error">неверный логин или пароль</p>
      <button type="submit">Войти</button>
    </form>
    <p>Нет аккаунта? <a href="#">Регистрация</a></p>
  </div>

  <!-- ПРОФИЛЬ -->
  <div class="auth-card profile">
    <h2>Профиль</h2>
    <p><strong>Имя:</strong> Иван Петров</p>
    <p><strong>Email:</strong> ivan@mail.com</p>
    <p><strong>Телефон:</strong> +7 999 123-45-67</p>
    <form style="margin-top: 16px" onsubmit="event.preventDefault()">
      <button type="submit">Выйти</button>
    </form>
  </div>

</body>
</html>
